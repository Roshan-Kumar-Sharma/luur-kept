rationale:
  ceiling: "Acetate is weak wet, shrinks, and water-marks readily. Most acetate garments are linings and most are labelled for solvent cleaning."
  shed_class: "Acetate released more fibre than any other material in the tested set — worth knowing given how often it appears as a lining nobody thinks about."
  wet_strength: "Among the weakest wet of any apparel fibre."
  dye_bleed_risk: "Acetate linings are frequently the source of dye transfer onto the shell of a garment."
