rationale:
  odour_retention: "The highest of any common fibre, and the exact opposite of wool. Polyester is oil-loving, so body oils bind to the fibre and the odour compounds they carry stay there through gentle treatment. This is why 'wash less' is true of a merino jumper and false of a polyester base layer — the same advice cannot cover both."
  max_safe_temp_c: "Polyester survives higher temperatures structurally, but heat drives body oils further into the fibre where they set, and hot cycles measurably increase fibre release. The limit here is about outcome, not melting point."
  shed_class: "Mechanically-treated polyester — fleece and jersey — releases on the order of six times as much fibre as woven filament nylon in washing."
  pilling_risk: "Strong fibres do not break off when they pill, so polyester pills stay attached and accumulate."
  wears_per_wash_baseline: "Once odour is established in polyester it does not air out, so the useful window between washes is short."
