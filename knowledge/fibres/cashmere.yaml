rationale:
  ceiling: "Cashmere is a very fine protein fibre with even less tolerance for agitation than sheep's wool. A hot wash is the textbook irreversible mistake."
  wet_strength: "Extremely weak wet. It must be lifted with both hands and never wrung or hung to drain."
  pilling_risk: "The fineness that makes cashmere feel as it does is also why it pills at every friction point in the first season."
  odour_retention: "Shares wool's low odour retention, so airing between wears is usually the whole answer."
