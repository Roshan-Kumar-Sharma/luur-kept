rationale:
  ceiling: "Lyocell keeps far more of its strength wet than viscose does, so a cold delicate cycle is within its tolerance."
  odour_retention: "Moves moisture away from the skin better than viscose does, which slows odour development — but it is still an absorbent cellulosic worn next to skin, and it does take up body oils."
  pilling_risk: "Prone to fibrillation — surface fibres split under wet abrasion and show as a pale bloom on dark colours."
