rationale:
  ceiling: "Nylon is mechanically tough but heat-sensitive; a cold normal cycle is well within tolerance and a warm one is not worth the risk to any elastane blended with it."
  sun_sensitivity: "Nylon yellows and loses strength under ultraviolet light, so drying it in direct sun shortens its life measurably."
  shed_class: "Fibre release rises with fabric thickness in nylon; a thin woven shell sheds far less than a thick knitted one."
  odour_retention: "Oil-loving like polyester, though it holds odour somewhat less tenaciously."
