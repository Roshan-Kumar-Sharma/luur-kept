# Golden set. READ evals/golden/PROVENANCE.md BEFORE QUOTING ANY NUMBER FROM THIS.
#
# Per labelled situation:
#   expected_primary  what a careful person should do        -> decision_accuracy, within_one_step
#   max_safe_action   the most aggressive DOMESTIC action     -> damage_avoidance_recall
#                     that would not damage this garment.
#                     Labelled independently of the engine.
#   wash_required     would a wash genuinely be needed?       -> over_wash_rate

cases:
  - id: merino-jumper
    provenance: synthetic_engineer
    label: "Fine merino crewneck jumper"
    garment:
      fibres: [{ fibre: merino, pct: 100 }]
      construction: knit
      category: knitwear
      colour_depth: mid
    situations:
      - id: three-wears-clean
        situation: { wears_since_wash: 3, next_to_skin: false, soil: [none], activity: sedentary }
        expected_primary: air_out
        max_safe_action: hand_wash_cold
        wash_required: false
      - id: eight-wears-smells
        situation: { wears_since_wash: 8, next_to_skin: true, soil: [body_odour], activity: active }
        expected_primary: hand_wash_cold
        max_safe_action: hand_wash_cold
        wash_required: true
        note: "Labelled against the brand thesis on purpose. Merino resists odour; it does not defy it."
      - id: soup-down-the-front
        situation: { wears_since_wash: 2, next_to_skin: false, soil: [food_grease], activity: sedentary }
        expected_primary: spot_clean
        max_safe_action: hand_wash_cold
        wash_required: false

