name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Layering — the engine must not import the model
        run: pnpm lint:layers

      - name: Knowledge base — citations, vocabulary, out-of-scope claims
        run: pnpm lint:knowledge

      # No API key is set here on purpose. Everything below must pass without
      # one: the explainer falls back to the deterministic renderer, and a
      # decision never depends on a model being reachable.
      - name: Tests, including the care-ceiling property tests
        run: pnpm test

      # The gate that matters. `pnpm evals` exits non-zero if
      # damage_avoidance_recall is below 100%, or if it or over_wash_rate has
      # regressed against engine/evals/baseline.json. Recommending a treatment
      # that would destroy a garment is not a metric to trade against anything.
      - name: Evals — damage_avoidance_recall gate
        run: pnpm evals

      - name: Web build
        run: pnpm build
